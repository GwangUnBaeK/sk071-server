name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'k8s/*.yaml'

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/main/**'
            k8s:
              - 'k8s/*.yaml'

  build:
    needs: check-changes
    if: needs.check-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sk071-server:${{ github.sha }}

      - name: Update k8s image tag
        run: |
          sed -i "s|image: gwangun/sk071-server:.*|image: gwangun/sk071-server:${{ github.sha }}|g" k8s/deploy.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deploy.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push

  deploy:
    needs: [check-changes, build]
    if: |
      needs.check-changes.outputs.src == 'true' &&
      needs.check-changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit messages
        id: commits
        run: |
          COMMITS=$(git log --pretty=format:"- %s" -10)
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get current datetime
        id: datetime
        run: echo "datetime=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release Note
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ steps.datetime.outputs.datetime }}
          release_name: release-${{ steps.datetime.outputs.datetime }}
          body: |
            ## 변경된 커밋 목록
            ${{ steps.commits.outputs.messages }}