name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/**'

permissions:
  contents: write

jobs:

  # CI Job
  # 트리거: pull_request 이벤트일 때만 실행
  # 목적: main merge 전 빌드 가능 여부 검증
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false

  # check-changes Job
  # 트리거: push 이벤트일 때만 실행
  # 목적: src/main/** 변경 여부 감지
  check-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/main/**'

  # build Job
  # 트리거: push 이벤트 AND src/main/** 변경됐을 때만 실행
  # 목적: Docker 이미지 빌드 → DockerHub push → 릴리즈 노트 생성
  # CronJob 방식에서는 k8s yaml 수정 불필요
  # 태그: 날짜+시간 형식 (CronJob이 최신 태그 판단하기 위해)
  build:
    needs: check-changes
    if: |
      github.event_name == 'push' &&
      needs.check-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 날짜+시간 태그 생성
      # CronJob이 날짜 기준으로 최신 태그 판단 가능
      - name: Set image tag
        id: tag
        run: echo "tag=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # Dockerfile 기준으로 이미지 빌드 후 DockerHub에 push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sk071-server:${{ steps.tag.outputs.tag }}

      # 최근 10개 커밋 메시지 가져오기
      - name: Get commit messages
        id: commits
        run: |
          COMMITS=$(git log --pretty=format:"- %s" -10)
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # GitHub Releases에 릴리즈 노트 자동 생성
      - name: Create Release Note
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.tag.outputs.tag }}
          name: release-${{ steps.tag.outputs.tag }}
          body: |
            ## 변경된 커밋 목록
            ${{ steps.commits.outputs.messages }}