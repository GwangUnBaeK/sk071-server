name: CI/CD Pipeline

# 트리거 설정
# push: main 브랜치에 src/main/ 또는 k8s/*.yaml 변경 시 실행
# pull_request: main 브랜치 대상 PR에서 src/main/ 변경 시 실행
on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'k8s/*.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/main/**'

# github-actions[bot]이 레포에 push할 수 있도록 쓰기 권한 부여
permissions:
  contents: write

jobs:

  # CI Job
  # 트리거: pull_request 이벤트일 때만 실행
  # 목적: main merge 전 빌드 가능 여부 검증 (DockerHub push 없음)
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build check
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # 빌드 검증만, DockerHub에 올리지 않음

  # check-changes Job
  # 트리거: push 이벤트일 때만 실행
  # 목적: 변경된 파일 감지 후 결과를 output으로 내보냄
  #   - src: src/main/** 변경 여부
  #   - k8s: k8s/*.yaml 변경 여부
  check-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/main/**'
            k8s:
              - 'k8s/*.yaml'

  # build Job
  # 트리거: push 이벤트 AND src/main/** 변경됐을 때만 실행
  # 목적: Docker 이미지 빌드 → DockerHub push → k8s yaml 태그 자동 수정
  # output: k8s_updated=true
  build:
    needs: check-changes
    if: |
      github.event_name == 'push' &&
      needs.check-changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    outputs:
      k8s_updated: ${{ steps.update_k8s.outputs.k8s_updated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile 기준으로 이미지 빌드 후 DockerHub에 push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sk071-server:${{ github.sha }}

      # k8s/deploy.yaml의 이미지 태그를 방금 push한 커밋 해시로 교체
      # sed 명령어로 기존 태그를 새 태그로 치환 후 커밋 & push
      # 완료 후 k8s_updated=true를 output으로 내보내 deploy Job을 트리거
      - name: Update k8s image tag
        id: update_k8s
        run: |
          sed -i "s|image: gwangun/sk071-server:.*|image: gwangun/sk071-server:${{ github.sha }}|g" k8s/deploy.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deploy.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push
          echo "k8s_updated=true" >> $GITHUB_OUTPUT

  # deploy Job
  # 트리거: 아래 두 가지 경우 중 하나라도 해당하면 실행 (OR 조건)
  #   1. build Job이 성공해서 k8s yaml을 자동 수정한 경우 (k8s_updated=true)
  #   2. 사용자가 직접 k8s/*.yaml을 수정한 경우 (k8s=true)
  # 목적: 릴리즈 노트 자동 생성 + minikube 로컬 클러스터에 실제 배포
  # runs-on: self-hosted (Windows PowerShell에서 실행)
  deploy:
    needs: [check-changes, build]
    if: |
      always() &&
      github.event_name == 'push' && (
        needs.build.result == 'success' ||
        needs.check-changes.outputs.k8s == 'true'
      )
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell  # Windows PowerShell 문법 사용
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 최근 10개 커밋 메시지를 가져와서 output으로 저장
      - name: Get commit messages
        id: commits
        run: |
          $commits = git log --pretty=format:"- %s" -10
          echo "messages<<EOF" >> $env:GITHUB_OUTPUT
          echo $commits >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      # 릴리즈 노트 제목에 사용할 날짜시간 생성
      - name: Get current datetime
        id: datetime
        run: |
          $datetime = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "datetime=$datetime" >> $env:GITHUB_OUTPUT

      # GitHub Releases에 릴리즈 노트 자동 생성
      - name: Create Release Note
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.datetime.outputs.datetime }}
          name: release-${{ steps.datetime.outputs.datetime }}
          body: |
            ## 변경된 커밋 목록
            ${{ steps.commits.outputs.messages }}

      # minikube 로컬 클러스터에 실제 배포
      - name: Deploy to minikube
        run: |
          kubectl apply -f k8s/deploy.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml