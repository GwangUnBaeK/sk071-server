# k8s/cronjob-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-redeploy-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-redeploy-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-redeploy-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: auto-redeploy-sa
roleRef:
  kind: Role
  name: auto-redeploy-role
  apiGroup: rbac.authorization.k8s.io