apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-redeploy
  namespace: default
spec:
  schedule: "*/3 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: auto-redeploy-sa
          containers:
          - name: redeploy
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              # =====================
              # 1. 이미지 태그 비교 (src/main 변경 대응)
              # =====================
              LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/gwangun/sk071-server/tags?page_size=10" \
                | grep -o '"name":"[^"]*"' \
                | grep -v "latest" \
                | head -1 \
                | cut -d'"' -f4)

              CURRENT_TAG=$(kubectl get deployment sk071-myfirst-api-server \
                -o jsonpath='{.spec.template.spec.containers[0].image}' \
                | cut -d: -f2)

              echo "Latest tag: $LATEST_TAG"
              echo "Current tag: $CURRENT_TAG"

              if [ "$LATEST_TAG" != "$CURRENT_TAG" ]; then
                echo "Image tag changed. Updating..."
                kubectl set image deployment/sk071-myfirst-api-server \
                  myfirst-api-server=gwangun/sk071-server:$LATEST_TAG
              else
                echo "Image tag no change. Skip."
              fi

              # =====================
              # 2. k8s/*.yaml 변경 감지 (yaml 변경 대응)
              # =====================

              # GitHub API로 main 브랜치 최신 커밋 해시 가져오기
              LATEST_COMMIT=$(curl -s \
                "https://api.github.com/repos/GwangUnBaeK/sk071-server/commits/main" \
                | tr ',' '\n' \
                | grep '"sha"' \
                | head -1 \
                | tr -d ' "' \
                | cut -d: -f2)

              echo "Latest commit: $LATEST_COMMIT"

              # ConfigMap에서 마지막 적용 커밋 해시 가져오기
              LAST_COMMIT=$(kubectl get configmap deploy-state \
                -o jsonpath='{.data.last-commit}' 2>/dev/null)

              echo "Last applied commit: $LAST_COMMIT"

              # 커밋 해시가 같으면 스킵
              if [ "$LATEST_COMMIT" = "$LAST_COMMIT" ]; then
                echo "No new commits. Skip."
                exit 0
              fi

              # 마지막 적용 커밋 이후 변경된 파일 목록 가져오기
              if [ -z "$LAST_COMMIT" ]; then
                # 처음 실행이면 최신 커밋만 확인
                CHANGED_FILES=$(curl -s \
                  "https://api.github.com/repos/GwangUnBaeK/sk071-server/commits/main" \
                  | tr ',' '\n' \
                  | grep '"filename"' \
                  | tr -d ' "' \
                  | cut -d: -f2)
              else
                # 마지막 적용 커밋 이후 모든 커밋 변경 파일 확인
                CHANGED_FILES=$(curl -s \
                  "https://api.github.com/repos/GwangUnBaeK/sk071-server/compare/$LAST_COMMIT...$LATEST_COMMIT" \
                  | tr ',' '\n' \
                  | grep '"filename"' \
                  | tr -d ' "' \
                  | cut -d: -f2)
              fi

              echo "Changed files: $CHANGED_FILES"

              # k8s/*.yaml 변경됐는지 확인 (configmap, cronjob 관련 파일 제외)
              K8S_CHANGED=$(echo "$CHANGED_FILES" | grep "^k8s/.*\.yaml$" | grep -v "cronjob" | grep -v "configmap")

              if [ -n "$K8S_CHANGED" ]; then
                echo "k8s yaml changed. Applying..."
                echo "Changed k8s files: $K8S_CHANGED"

                # 필요한 파일만 직접 가져오기 (git clone 대신)
                curl -s "https://raw.githubusercontent.com/GwangUnBaeK/sk071-server/main/k8s/deploy.yaml" -o /tmp/deploy.yaml
                curl -s "https://raw.githubusercontent.com/GwangUnBaeK/sk071-server/main/k8s/service.yaml" -o /tmp/service.yaml
                curl -s "https://raw.githubusercontent.com/GwangUnBaeK/sk071-server/main/k8s/ingress.yaml" -o /tmp/ingress.yaml

                # 다운로드된 deploy.yaml 내용 출력 (디버그)
                echo "=== deploy.yaml before sed ==="
                cat /tmp/deploy.yaml

                # 이미지 태그를 최신 태그로 교체
                sed -i "s|image: gwangun/sk071-server:.*|image: gwangun/sk071-server:$LATEST_TAG|g" /tmp/deploy.yaml

                # sed 적용 후 내용 출력 (디버그)
                echo "=== deploy.yaml after sed ==="
                cat /tmp/deploy.yaml

                kubectl apply -f /tmp/deploy.yaml
                kubectl apply -f /tmp/service.yaml
                kubectl apply -f /tmp/ingress.yaml
              else
                echo "No k8s yaml change. Skip."
              fi

              # ConfigMap 마지막 적용 커밋 업데이트
              kubectl patch configmap deploy-state \
                --patch "{\"data\":{\"last-commit\":\"$LATEST_COMMIT\"}}"

              echo "Done."
          restartPolicy: OnFailure